name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Claude plugin manifest
        run: claude plugins validate .claude-plugin/marketplace.json

      - name: Validate vellum plugin (manifest + components)
        run: claude plugins validate .

      - name: Lint vellum (deep frontmatter validation, Meridian-vocab leaks, attribution headers, hooks.json, size cap)
        # lint_vellum.py owns the component checks the claude CLI does not run:
        # agent/skill/command frontmatter (name == filename, model tiering,
        # description, declared skills exist), plus vocab/headers/size-cap.
        run: python3 scripts/ci/lint_vellum.py

  tests:
    uses: ./.github/workflows/tests.yml

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install site-only dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-site.txt

      - name: Build the site and fail if docs/ is stale
        # Deterministic build: version comes from plugin.json, entries from
        # frontmatter, no timestamps. --check rebuilds and then requires the
        # committed docs/ tree to match exactly.
        run: python scripts/build_site.py --check

      - name: Sweep every generated page and asset for references that 404
        # The advertised host is not live during CI, so resolve pages and local
        # assets on disk instead of over the network.
        run: python scripts/ci/check_site_links.py
